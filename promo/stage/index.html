<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Police — promo stage</title>
<!-- 1920×1080. Deterministic: window.render(t). The panel is the REAL popup.html
     captured by capture/shoot.mjs; nothing inside it is redrawn. -->
<style>
  @font-face{font-family:"Inter";src:url(../assets/fonts/InterVariable-latin.woff2) format("woff2");font-weight:100 900}
  :root{--bg:#101218;--ink:#f3f5f9;--muted:#9aa3b3;--accent:#7fe3c3;--bad:#ef7d7d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
  #bg{position:absolute;inset:0;background:
    radial-gradient(1100px 700px at 78% 30%, rgba(79,217,168,.13), transparent 62%),
    radial-gradient(900px 600px at 10% 100%, rgba(110,155,245,.10), transparent 60%), #0b0d12}
  #panel{position:absolute;left:1160px;top:36px;width:460px;height:900px;transform-origin:0 0;border-radius:22px;overflow:hidden;background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.6),0 0 120px rgba(79,217,168,.08)}
  #panel img{position:absolute;left:0;top:0;width:460px;height:900px;transform-origin:0 0;opacity:0}
  #head{position:absolute;left:150px;top:0;height:1080px;width:900px;display:flex;flex-direction:column;justify-content:center}
  .h{position:absolute;left:0;font-size:96px;font-weight:720;letter-spacing:-.04em;line-height:1.02;opacity:0;white-space:pre-line}
  .h .k{color:var(--accent)}
  #kicker{position:absolute;left:150px;top:300px;font-size:24px;font-weight:600;letter-spacing:.18em;color:var(--accent);opacity:0}
  #hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center}
  #hook .names{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:1500px}
  #hook .names span{font-size:64px;font-weight:700;letter-spacing:-.03em;opacity:0}
  #hook .q{margin-top:44px;font-size:52px;font-weight:600;letter-spacing:-.025em;color:rgba(255,255,255,.62);opacity:0}
  #cap{position:absolute;left:150px;width:900px;bottom:150px;display:flex;justify-content:flex-start;pointer-events:none}
  body.center #cap{left:0;width:1920px;justify-content:center;bottom:70px}
  #cap span{font-size:34px;font-weight:560;padding:10px 22px;border-radius:12px;background:rgba(0,0,0,.62);max-width:1500px;text-align:left;line-height:1.3}
  #end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;
    background:radial-gradient(900px 600px at 50% 42%, rgba(79,217,168,.14), transparent 70%),#0b0d12}
  #end img{width:190px;height:190px}
  #end .word{margin-top:26px;font-size:104px;font-weight:760;letter-spacing:-.045em}
  #end .tag{margin-top:6px;font-size:40px;font-weight:520;color:rgba(255,255,255,.8);letter-spacing:-.02em}
  #end .row{display:flex;gap:12px;margin-top:36px}
  #end .pill{font-size:22px;font-weight:540;color:rgba(255,255,255,.78);padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.16)}
  #end .url{margin-top:30px;font-size:28px;font-weight:600;color:var(--accent)}
  #black{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>
<div id="bg"></div>
<div id="kicker">TOKEN POLICE</div>
<div id="head"></div>
<div id="panel"></div>
<div id="hook"><div class="names"><span>Claude Code</span><span>Codex</span><span>Cursor</span><span>Grok</span><span>Gemini</span></div>
  <div class="q">Which one is about to run out?</div></div>
<div id="end"><img src="../../icons/token-police.svg" alt="">
  <div class="word">Token Police</div><div class="tag">Every AI quota. One side panel.</div>
  <div class="row"><span class="pill">Free</span><span class="pill">Open source</span><span class="pill">Chrome extension</span><span class="pill">Stays in your browser</span></div>
  <div class="url">token-police.philosophie.ai</div></div>
<div id="cap"><span></span></div>
<div id="black"></div>
<script src="../build/vo_timing.js"></script>
<script src="./timeline.js"></script>
</body>
</html>
