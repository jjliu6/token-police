<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/mark-128.png">
<style>
  :root{--card2:#1f232c;--ink:#eef1f6;--ink2:#aab2c0;--muted:#6b7382;--track:#2a2f3a;--line:#23272f;--good:#5ccf9e;--warn:#e6b45c;--bad:#e57373}
  *{box-sizing:border-box;margin:0;padding:0}
  /* Side panel viewport is not 100vh (browser chrome + Chrome's panel header
     eat height). Size to the panel and scroll inside it, or the version /
     credits line gets clipped against the bottom edge. */
  html{height:100%;background:#14161c}
  html,body{min-height:100%}
  body{width:100%;background:#14161c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);padding:12px 13px 18px;min-height:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow-x:hidden;overflow-y:auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .brand{font-weight:700;letter-spacing:.12em;font-size:12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .brand .s{color:#8fe3c6}
  .mascot{display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none;position:relative}
  .mascot svg{display:block;width:72px;height:86px;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .mascot .hl{display:flex;flex-direction:column;align-items:center;line-height:1.1;margin-top:-2px}
  .mascot .hl b{font-size:13px;font-variant-numeric:tabular-nums}
  .mascot .hl i{font-style:normal;font-size:8px;letter-spacing:.08em;color:var(--muted)}
  .mascot .h{transform-box:fill-box;transform-origin:50% 20%;transition:opacity .8s ease,transform .8s cubic-bezier(.2,1.15,.3,1)}
  .mascot .h.off{opacity:0;transform:translateY(-10px) rotate(14deg) scale(.72)}
  /* 做完动一动：发丝按刘海→头顶依次长回，头上一圈金光和星点 */
  .mascot.regrow{filter:drop-shadow(0 0 10px rgba(255,214,90,.95)) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .mascot.regrow .h{transform-origin:50% 50%;transition:none;animation:hair-sprout .55s cubic-bezier(.16,1.35,.3,1) both;animation-delay:calc(var(--i, 0) * 38ms)}
  .mascot.regrow .h.off{animation:none;opacity:0;transform:translateY(-10px) rotate(14deg) scale(.72)}
  .mascot.regrow .hl b{animation:hair-pct-pop .9s ease}
  .mascot.regrow::after{content:"";position:absolute;left:50%;top:36%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,160,.95) 0%,rgba(255,196,64,.0) 70%);animation:hair-flash .75s ease-out both;pointer-events:none;z-index:2}
  .mascot .grow-fx{position:absolute;left:-8px;right:-8px;top:-6px;height:96px;pointer-events:none;overflow:visible;z-index:3}
  .mascot .grow-fx i{position:absolute;width:13px;height:13px;margin:-6px 0 0 -6px;background:#ffe27a;clip-path:polygon(50% 0,63% 38%,100% 50%,63% 62%,50% 100%,37% 62%,0 50%,37% 38%);opacity:0;animation:spark-pop 1.05s ease-out both;animation-delay:var(--d,0s);transform:scale(var(--s,1))}
  .mascot .grow-fx i:nth-child(3n){background:#9ff0d2}
  .mascot .grow-fx i:nth-child(3n+2){background:#fff4c2}
  @keyframes hair-sprout{0%{opacity:0;transform:scale(.12) rotate(-18deg)}62%{opacity:1;transform:scale(1.18) rotate(6deg)}100%{opacity:1;transform:none}}
  @keyframes hair-regrow-pop{0%{transform:scale(.88) translateY(8px) rotate(-5deg)}30%{transform:scale(1.12) translateY(-12px) rotate(6deg)}58%{transform:scale(.97) translateY(-2px) rotate(-2deg)}100%{transform:scale(1) translateY(0) rotate(0)}}
  @keyframes hair-flash{0%{transform:scale(.35);opacity:0}32%{transform:scale(1.85);opacity:1}100%{transform:scale(3.1);opacity:0}}
  @keyframes hair-pct-pop{0%,100%{transform:scale(1)}40%{transform:scale(1.28)}}
  @keyframes spark-pop{0%{opacity:0;transform:scale(0) rotate(0)}22%{opacity:1;transform:scale(calc(var(--s,1) * 1.35)) rotate(18deg)}100%{opacity:0;transform:scale(calc(var(--s,1) * .35)) translateY(-18px) rotate(52deg)}}
  .buddy{position:fixed;z-index:40;top:54px;right:8px;width:176px;padding:10px 10px 12px;background:rgba(20,22,28,.20);border:1px solid rgba(255,255,255,.10);border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:grab;user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;transition:left 7.2s cubic-bezier(.4,.08,.2,1),top 7.2s cubic-bezier(.4,.08,.2,1)}
  .buddy.dragging{cursor:grabbing;animation:none;transition:none!important}
  .buddy.wander .mascot{animation:buddy-bob 2.8s ease-in-out infinite}
  .buddy.wander .mascot.regrow{animation:hair-regrow-pop .85s cubic-bezier(.18,1.4,.32,1)}
  .buddy.dragging .mascot{animation:none}
  @keyframes buddy-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .say{margin:0 0 6px;max-width:100%;padding:0;color:rgba(180,188,200,.88);font-size:10px;font-weight:500;line-height:1.35;text-align:center;pointer-events:none}
  .say.on{animation:say-in .22s ease}
  @keyframes say-in{from{opacity:0}to{opacity:1}}
  .acts{margin-top:10px;width:100%}
  .acts .ttl{font-size:11px;color:var(--ink2);line-height:1.4;margin-bottom:8px}
  .acts .note{font-size:10.5px;color:var(--muted);line-height:1.4;margin:0 0 8px}
  .acts button{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.35;color:var(--ink);background:#2a2f3a;border:none;border-radius:9px;padding:8px 9px;margin-top:6px;cursor:pointer}
  .acts button:hover{background:#333a46}
  .acts button.done{text-align:center;background:#2f5d4a;color:#d9ffe9}
  .acts button.done:hover{background:#367058}
  .right{display:flex;align-items:center;gap:8px;flex:none}
  .upd{font-size:10px;color:var(--muted);white-space:nowrap}
  .leg{font-size:10px;color:var(--muted);white-space:nowrap}
  .btn{font-size:11px;color:var(--ink);background:#2a2f3a;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  /* 侧边栏可以被拖得很窄：先收起说明文字，再收起「x 分钟前」，保证头部永远一行 */
  @media (max-width:500px){.leg{display:none}}
  @media (max-width:380px){.upd{display:none}}
  .btn:hover{background:#333a46}
  .btn.lang{padding:5px 8px;min-width:40px}
  .grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;align-items:start}
  .stats{overflow:hidden}
  .l0 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .name{display:flex;align-items:center;gap:7px;font-weight:650;font-size:14px}
  .dot{width:9px;height:9px;border-radius:3px}
  .plan{font-size:10px;color:var(--muted)}
  .mid{display:flex;align-items:center;gap:13px}
  .ring{position:relative;width:66px;height:66px;flex:0 0 auto}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .c b{font-size:18px;line-height:1}
  .ring .c span{font-size:8.5px;letter-spacing:.1em;color:var(--muted);margin-top:2px}
  .stats{flex:1;min-width:0}
  .l0{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);gap:6px}
  .l0 .r{color:var(--muted);white-space:nowrap}
  .barwrap{margin-top:7px}
  .barwrap .t{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
  .bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px}
  .bar.stacked{display:flex}
  .bar.stacked>i{flex:none;border-radius:0}
  .barwrap .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#8a92a0;margin-top:7px;padding-top:6px;border-top:1px solid var(--line)}
  .foot span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .empty a{color:var(--ink2)}
  .bottom{flex:0 0 auto;margin-top:auto;padding:8px 4px 0}
  .hint{font-size:10.5px;color:var(--muted);text-align:center;margin:0 0 8px;line-height:1.4}
  .hint:empty{display:none}
  .ver{font-size:10px;color:var(--muted);text-align:center;margin:0;line-height:1.45;overflow-wrap:anywhere}
  .ver a{color:var(--ink2);text-decoration:none}
  .ver a:hover{text-decoration:underline}
  .ver a.new{color:var(--warn);font-weight:600}
  .credits{font-size:8.5px;color:#4a515e;text-align:center;margin:8px 0 0;padding:0;line-height:1.45}
  .credits a{color:#5f6775;text-decoration:none}
  .credits a:hover{text-decoration:underline}
  .share-bar{display:flex;justify-content:center;margin:8px 0 0}
  .btn.share{font-size:10.5px;padding:4px 12px;letter-spacing:.04em}
  .share-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(8,10,14,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .share-card{position:relative;width:100%;max-width:300px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px 14px;box-shadow:0 14px 36px rgba(0,0,0,.45);overflow:hidden}
  .share-card .shot{display:block;width:calc(100% + 24px);max-width:none;margin:-10px -12px 10px;height:auto;border:none;border-bottom:1px solid var(--line);background:#14161c}
  .share-card .ttl{font-size:12px;font-weight:700;letter-spacing:.08em;margin:0 28px 6px 0}
  .share-card .pitch{font-size:11.5px;color:var(--ink2);line-height:1.45;margin:0 0 10px}
  .share-card .url{font-size:10.5px;color:var(--muted);background:#2a2f3a;border-radius:8px;padding:7px 9px;margin:0 0 10px;overflow-wrap:anywhere;word-break:break-all;user-select:all}
  .share-actions{display:flex;gap:6px}
  .share-actions .btn{flex:1;text-align:center;padding:7px 8px}
  .share-actions .btn.copy{background:#2f5d4a;color:#d9ffe9}
  .share-actions .btn.copy:hover{background:#367058}
  .share-dismiss{position:absolute;top:8px;right:8px;z-index:1;width:26px;height:26px;border:none;border-radius:8px;background:rgba(20,22,28,.55);color:var(--ink2);font-size:16px;line-height:1;cursor:pointer}
  .share-dismiss:hover{background:rgba(20,22,28,.8);color:var(--ink)}
  .fail{font-size:10.5px;color:var(--bad);margin-top:7px;line-height:1.4}
  .fail a{color:var(--ink2);white-space:nowrap}
  .spark{margin-top:7px;border-bottom:1px solid var(--line)}
  .spark svg{display:block;width:100%;height:22px}
  .settings{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--ink2)}
  .settings label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .settings .st{color:var(--muted)}
  .settings .brk{flex-basis:100%;height:0}
  .stage{position:relative;flex:1 0 auto}
  @media (max-height:780px){
    body{padding:10px 12px 16px}
    .top{margin-bottom:8px}
    .grid{gap:7px}
    .card{padding:9px 11px}
    .bottom{padding-top:6px}
  }
  .veil{position:absolute;inset:0;z-index:20;background:rgba(12,14,18,.22);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);border-radius:14px;pointer-events:auto}
  .stage.veiled .grid{pointer-events:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="top">
    <span class="brand"><span class="s">✦</span> <span id="brand-name">TOKEN POLICE</span></span>
    <div class="right"><span class="upd" id="upd"></span><span class="leg" id="legend">number = remaining</span><button class="btn lang" id="lang" type="button" title="切换到中文">中文</button><button class="btn lang" id="gear" type="button" title="Choose tracked agents">⚙</button><button class="btn" id="refresh">Refresh</button></div>
  </div>
  <div class="settings" id="settings" hidden></div>
  <div class="stage" id="stage">
    <div class="grid" id="grid"></div>
    <div class="veil" id="veil" hidden></div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint"></div>
    <div class="ver" id="ver"></div>
    <div class="share-bar"><button class="btn share" id="share" type="button">Share</button></div>
    <div class="credits" id="credits"></div>
  </div>
  <div class="share-overlay" id="share-overlay" hidden>
    <div class="share-card" id="share-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <button class="share-dismiss" id="share-close" type="button" aria-label="Close">&times;</button>
      <img class="shot" id="share-shot" src="icons/share-preview-en.webp" alt="" width="640" height="472">
      <p class="ttl" id="share-title"></p>
      <p class="pitch" id="share-pitch"></p>
      <p class="url" id="share-url"></p>
      <div class="share-actions">
        <button class="btn copy" id="share-copy" type="button">Copy link</button>
        <button class="btn" id="share-x" type="button">Share on X</button>
      </div>
    </div>
  </div>
  <div class="buddy wander" id="buddy" hidden>
    <p class="say" id="say" hidden></p>
    <span class="mascot" id="hair" hidden></span>
    <div class="acts" id="acts" hidden></div>
  </div>
  <script src="agents.js"></script>
  <script src="activities.js"></script>
  <script src="update.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
