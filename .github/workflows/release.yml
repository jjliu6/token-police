name: Release

# Every push to main (docs-only changes excluded) publishes a GitHub Release
# automatically:
#   - if manifest.json's version has no release yet, that exact version is
#     released as-is (bump the version in your PR for a minor/major release);
#   - otherwise the patch version is bumped, the bump is committed back to
#     main, and the new version is released.
# The Download button in the README points at the stable-named asset this
# workflow attaches. Can also be run manually from the Actions tab.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'promo/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm test

      - name: Determine release version (auto-bump patch if already released)
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            VERSION=$(npm version patch --no-git-tag-version)
            VERSION=${VERSION#v}
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" manifest.json
            git commit -am "Release v$VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Stable-name copy for the releases/latest/download link
        run: cp "dist/token_police-${{ steps.version.outputs.version }}.zip" dist/token-police.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/token_police-${{ steps.version.outputs.version }}.zip
            dist/token-police.zip
